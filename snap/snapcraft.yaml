name: charmed-etcd # you probably want to 'snapcraft register <name>'
title: Charmed etcd
base: core24 # the base snap is the execution environment for this snap
version: "3.6.13" # just for humans, typically '1.2+git' or '1.3.2'
summary: etcd is a distributed reliable key-value store for distributed systems. # 79 char long summary
description: |
  etcd is a distributed reliable key-value store for the most critical data of a distributed system.
  etcd is written in Go and uses the Raft consensus algorithm to manage a highly-available replicated log.
contact: https://matrix.to/#/#charmhub-data-platform:ubuntu.com
license: Apache-2.0
donation:
issues: https://github.com/canonical/charmed-etcd-snap/issues
source-code: https://github.com/canonical/charmed-etcd-snap
website: https://canonical.com/data

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

apps:
  etcd:
    command: start-etcd.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    plugs:
      - network-bind
    environment:
      ETCD_CONFIG_FILE: $SNAP_DATA/etcd.conf.yml

  etcdctl:
    command: drop_priv.sh etcdctl
    plugs:
      - network-bind

  etcdutl:
    command: drop_priv.sh etcdutl
    plugs:
      - network-bind

  benchmark:
    command: drop_priv.sh benchmark
    plugs:
      - network-bind

  etcd-dump-logs:
    command: drop_priv.sh etcd-dump-logs

  etcd-dump-metrics:
    command: drop_priv.sh etcd-dump-metrics
    plugs:
      - network-bind

  rw-benchmark:
    command: rw-benchmark.sh
    plugs:
      - network-bind

  rw-heatmaps:
    command: drop_priv.sh rw-heatmaps

parts:
  etcd:
    plugin: make
    build-snaps: [go/latest/stable]
    stage-packages:
      - util-linux
      - bc
    source: https://git.launchpad.net/etcd
    source-type: git
    source-tag: lp-v3.6.13
    # TODO remove patch workaround once merged to upstream
    override-pull: |
      craftctl default
      cp $CRAFT_PROJECT_DIR/snap/upstream-patch/txn_mixed.go $CRAFT_PART_SRC/tools/benchmark/cmd/txn_mixed.go
    override-build: |
      make build
      cp -r bin $CRAFT_PART_INSTALL/
      
      # install tools
      export GOBIN="$CRAFT_PART_INSTALL/bin"  
      go install -v ./tools/benchmark
      go install -v ./tools/etcd-dump-logs
      go install -v ./tools/etcd-dump-metrics
      cd tools/rw-heatmaps
      go build -o $CRAFT_PART_INSTALL/bin/rw-heatmaps

  etcd-conf-file:
    plugin: dump
    source: .
    stage:
      - config/etcd.conf.yml
  wrapper:
    plugin: dump
    source: snap/local
